<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lienzo infinito</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#f7f8fa;--ui:#ffffff;--ui-t:#1b2330;--line:#d3d8e0;--hover:#eef1f5;--acc:#2563eb;--acc-t:#ffffff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:#1f2430;--ui-t:#e8ebf0;--line:#3a4254;--hover:#2a3142;--acc:#6ea0ff;--acc-t:#101521;color-scheme:dark}}
:root[data-theme="dark"]{--ui:#1f2430;--ui-t:#e8ebf0;--line:#3a4254;--hover:#2a3142;--acc:#6ea0ff;--acc-t:#101521;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--paper);color:var(--ui-t);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#c{position:fixed;inset:0;touch-action:none;cursor:crosshair;display:block}
#live{position:fixed;inset:0;pointer-events:none;display:block}
#c.hand{cursor:grab}#c.grabbing{cursor:grabbing}#c.eraser{cursor:cell}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 16px);
display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;background:var(--ui);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.grp{display:flex;gap:4px;align-items:center;padding-right:6px;border-right:1px solid var(--line)}
.grp:last-child{border:0;padding:0}
button{font:inherit;color:var(--ui-t);background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 10px;min-height:36px;cursor:pointer}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{background:var(--acc);color:var(--acc-t)}
#cols{flex-wrap:wrap;max-width:190px}
.sw{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--ui);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--acc)}
#pdf{background:var(--acc);color:var(--acc-t);font-weight:600}
#pdf:hover{filter:brightness(1.08);background:var(--acc)}
input[type=range]{width:100%;grid-column:1/-1}
select{font:inherit;color:var(--ui-t);background:var(--ui);border:1px solid var(--line);border-radius:9px;padding:6px;min-height:36px}
#zl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.bar{left:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;max-height:calc(100% - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));transform:none;max-width:none;width:104px;box-sizing:border-box;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;overflow-y:auto;gap:8px;padding:8px}
.grp{display:grid;grid-template-columns:repeat(2,40px);gap:4px;justify-content:center;align-items:center;padding:0 0 8px;border-right:0;border-bottom:1px solid var(--line)}
.grp:last-child{border:0;padding:0}
.bar button{width:40px;height:40px;min-height:0;padding:0;font-size:18px;display:grid;place-items:center}
.bar .sw{width:26px;height:26px;place-self:center}
#cols{max-width:none}
#zl{grid-column:1/-1;min-width:0}
#warn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:120px;right:8px;background:#dc2626;color:#fff;border-radius:10px;padding:8px 12px;z-index:6;font-size:13px}
.bar #sv{position:relative}
#dlg{left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:min(86vw,320px);gap:6px}
#dlg #dlt{font-weight:600;word-break:break-all;padding:2px 4px 6px}
.bar #sv.dirty::after{content:'';position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#dc2626}
#szv{grid-column:1/-1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
#pdf{font-size:12px}
.menu{position:fixed;z-index:5;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--ui);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.menu button{display:flex;gap:10px;justify-content:flex-start;align-items:center;min-height:40px;padding:6px 14px;font-size:16px;white-space:nowrap}
[hidden]{display:none!important}
.pill{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:0;width:44px;height:44px;font-size:20px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ui);color:var(--ui-t);border:1px solid var(--line);border-radius:10px;padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2330">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lienzo">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<canvas id="c"></canvas><canvas id="live"></canvas>
<div id="dlg" class="menu" hidden role="dialog" aria-label="Archivo listo">
 <div id="dlt"></div>
 <button id="dl1">⬇ Descargar</button><button id="dl2">⬇ Descargar (otro método)</button><button id="dl3">📤 Compartir / guardar en…</button><button id="dl4">🔗 Abrir en pestaña nueva</button><button id="dl5">Cerrar</button>
</div>
<div id="warn" hidden role="alert">⚠ Este navegador no está guardando automáticamente. Toca 💾 para guardar una copia.</div>
<div id="toast" role="status"></div>
<div id="shmenu" class="menu" hidden>
 <button data-sh="line" aria-pressed="false">╱ Línea</button><button data-sh="arrow" aria-pressed="false">↗ Flecha</button><button data-sh="darrow" aria-pressed="false">⤢ Flecha doble</button><button data-sh="rect" aria-pressed="false">▭ Rectángulo</button><button data-sh="ell" aria-pressed="false">◯ Círculo / elipse</button><button data-sh="tri" aria-pressed="false">△ Triángulo</button><button data-sh="dia" aria-pressed="false">◇ Rombo</button>
</div>
<button id="show" class="pill" hidden aria-label="Mostrar herramientas">☰</button>
<div class="bar" role="toolbar" aria-label="Herramientas">
 <div class="grp"><button id="hide" aria-label="Ocultar herramientas" title="Ocultar barra">◂</button></div>
 <div class="grp">
  <button id="t-pen" aria-pressed="true" title="Lápiz">✎</button>
  <button id="t-hl" aria-pressed="false" title="Resaltador (semitransparente)">🖍</button>
  <button id="t-eraser" aria-pressed="false" title="Borrador (el grosor ajusta su tamaño)">⌫</button>
  <button id="em" aria-pressed="true" title="Parcial: borra solo la parte que tocas. Desactívalo para borrar el trazo entero">✂</button>
  <button id="t-hand" aria-pressed="false" title="Mover el lienzo (o mantén Espacio)">✋</button>
  <button id="t-select" aria-pressed="false" title="Seleccionar: arrastra un recuadro o toca un dibujo; luego mover, rotar o escalar">⬚</button>
  <button id="t-lasso" aria-pressed="false" title="Lazo: dibuja un contorno alrededor de lo que quieres seleccionar">➰</button>
  <select id="shp" hidden aria-label="Formas" title="Formas (Shift = proporcional o a 45°)"><option value="">▭ Formas</option><option value="line">Línea</option><option value="arrow">Flecha</option><option value="darrow">Flecha doble</option><option value="rect">Rectángulo</option><option value="ell">Círculo / elipse</option><option value="tri">Triángulo</option><option value="dia">Rombo</option></select>
  <button id="shbtn" aria-pressed="false" title="Formas">▭</button>
 </div>
 <div class="grp" id="cols" aria-label="Color"></div>
 <div class="grp"><input id="sz" type="range" min="0.2" max="24" step="0.1" value="3" aria-label="Grosor" title="Grosor (también aplica a la selección)"><span id="szv" title="Tamaño del lápiz">3</span></div>
 <div class="grp">
  <button id="un" title="Deshacer (Ctrl+Z)">↶</button>
  <button id="re" title="Rehacer (Ctrl+Shift+Z)">↷</button>
  <button id="del" title="Eliminar selección (Supr)">🗑</button>
  <button id="img" title="Agregar imagen (también puedes pegar o arrastrar)">🖼</button><input id="fi" type="file" accept="image/*" hidden>
  <button id="cl" title="Borrar todo" aria-label="Borrar todo">🧹</button>
 </div>
 <div class="grp">
  <span id="zl">100%</span><button id="zo" aria-label="Alejar">−</button><button id="zi" aria-label="Acercar">+</button>
  <button id="fit" title="Ver todo" aria-label="Ver todo">⛶</button>
 </div>
 <div class="grp"><button id="pm" aria-pressed="false" title="Solo el lápiz dibuja; el dedo mueve y hace zoom (rechazo de palma)">✍</button><button id="lk" aria-pressed="false" title="Fijar lienzo: bloquea mover y zoom con los dedos">🔒</button><button id="dk" aria-pressed="false" title="Hoja oscura" aria-label="Hoja oscura">🌙</button><button id="htm" title="Descarga un HTML para ver el dibujo en cualquier navegador">🌐</button><button id="sv" title="Guardar proyecto: copia completa para abrir después (punto rojo = hace rato que no guardas copia)">💾</button><button id="op" title="Abrir un proyecto guardado">📂</button><button id="ab" aria-pressed="false" title="Copia automática cada 5 minutos en la carpeta Descargas">⏱</button>
<button id="driveBtn" title="Conectar y sincronizar Google Drive">☁️</button>
<input id="pj" type="file" hidden><button id="pdf" title="Exportar PDF" aria-label="Exportar PDF">PDF</button></div>
</div>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),lv=document.getElementById('live'),lctx=lv.getContext('2d'),zl=document.getElementById('zl'),$=id=>document.getElementById(id);
const COLORS=['#000000','#ffffff','#dc2626','#7c3aed','#1e3a8a','#2563eb','#166534','#4ade80','#facc15','#fdba74','#78350f','#ea580c'];
let dpr=1,W=0,H=0,view={x:0,y:0,z:1},strokes=[],undo=[],redo=[],tool='pen',color=COLORS[0],size=3,cur=null,space=false,dark=false,shape='',penSeen=false,sel=[],selG=null,partial=true,penMode=false,penDown=false,penUp=0,lastE=null,lock=false,lvq=0,incOn=false,incI=2;
const ptrs=new Map();let gest=null,erasing=false,snap=false,panning=false,lastP=null,clearT=0;

const idb=new Promise(r=>{try{const q=indexedDB.open('lienzo-img',1);q.onupgradeneeded=()=>q.result.createObjectStore('i');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function idbPut(k,v){const d=await idb;if(!d)return false;return new Promise(r=>{try{const t=d.transaction('i','readwrite');t.objectStore('i').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false);t.onabort=()=>r(false)}catch(e){r(false)}})}
async function idbGet(k){const d=await idb;if(!d)return null;return new Promise(r=>{try{const q=d.transaction('i').objectStore('i').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
try{const d=JSON.parse(localStorage.getItem('lienzo-v1')||'null');if(d&&Array.isArray(d.strokes)){strokes=d.strokes;view=d.view||view;dark=!!d.dark}else view=null}catch(e){view=null}
const lsHad=strokes.length>0;
for(const s of strokes)if(s.img&&!s.src&&s.id)idbGet(s.id).then(v=>{if(v){s.src=v;draw()}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
idbGet('state').then(st=>{if(lsHad||!st||!Array.isArray(st.strokes)||!st.strokes.length)return;strokes=st.strokes;if(st.view)view=st.view;dark=!!st.dark;$('dk').setAttribute('aria-pressed',dark);refreshSw();for(const s of strokes)if(s.img&&!s.src&&s.id)idbGet(s.id).then(v=>{if(v){s.src=v;draw()}});draw()});
idb.then(d=>{let ok=true;try{localStorage.setItem('lienzo-t','1');localStorage.removeItem('lienzo-t')}catch(e){ok=false}if(!d&&!ok)$('warn').hidden=false});
function save(){clearTimeout(save.t);save.t=setTimeout(()=>{try{localStorage.setItem('lienzo-v1',JSON.stringify({strokes,view,dark}))}catch(e){if(strokes.some(s=>s.img))toast('Imágenes muy pesadas: no se guardan en este navegador')}},700)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

function resize(){dpr=Math.min(2,Math.max(1.5,window.devicePixelRatio||1));dpr=Math.min(dpr,Math.sqrt(4e6/(innerWidth*innerHeight)));W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';lv.width=W*dpr;lv.height=H*dpr;lv.style.width=W+'px';lv.style.height=H+'px';if(!view)view={x:W/2,y:H/2,z:1};draw()}
function tw(x,y){return[(x-view.x)/view.z,(y-view.y)/view.z]}
const DK={'#1b2330':'#eef0f4','#2563eb':'#6b9bff','#dc2626':'#ff7272','#16a34a':'#4ade80','#d97706':'#fbbf24','#7c3aed':'#b197fc','#1e3a8a':'#7b9cff','#166534':'#4cc77a','#78350f':'#c68b59','#6b7280':'#9ca3af','#ea580c':'#fb923c','#eab308':'#facc15','#0d9488':'#2dd4bf','#0ea5e9':'#38bdf8','#db2777':'#f472b6'};
function col(c){return dark&&DK[c]?DK[c]:c}
function refreshSw(){document.querySelectorAll('.sw').forEach(b=>b.style.background=col(b.dataset.c))}
function path(s){const p=s.p;ctx.globalAlpha=s.hl?.35:1;ctx.strokeStyle=col(s.c);ctx.lineWidth=Math.max(s.w,.5/view.z);ctx.beginPath();ctx.moveTo(p[0],p[1]);
 if(p.length<4)ctx.lineTo(p[0]+.01,p[1]);
 else if(s.k){for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1])} else{for(let i=2;i<p.length-2;i+=2)ctx.quadraticCurveTo(p[i],p[i+1],(p[i]+p[i+2])/2,(p[i+1]+p[i+3])/2);ctx.lineTo(p[p.length-2],p[p.length-1])}
 ctx.stroke()}
let dq=0;
function draw(){if(dq)return;dq=requestAnimationFrame(()=>{dq=0;drawNow()})}
function drawLive(){if(lvq)return;lvq=requestAnimationFrame(()=>{lvq=0;lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,lv.width,lv.height);if(!cur)return;lctx.setTransform(dpr*view.z,0,0,dpr*view.z,dpr*view.x,dpr*view.y);lctx.lineCap='round';lctx.lineJoin='round';const m=ctx;ctx=lctx;path(cur);ctx.globalAlpha=1;ctx=m})}
function drawNow(){lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,lv.width,lv.height);rv={x:view.x,y:view.y,z:view.z};cv.style.transform='';
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=dark?'#151922':'#f7f8fa';ctx.fillRect(0,0,W,H);
 let g=32;while(g*view.z<22)g*=2;while(g*view.z>88)g/=2;
 const st=g*view.z,ox=((view.x%st)+st)%st,oy=((view.y%st)+st)%st;
 ctx.fillStyle=dark?'#2f3646':'#c3c9d4';
 for(let x=ox;x<W;x+=st)for(let y=oy;y<H;y+=st)ctx.fillRect(x-1,y-1,2,2);
 ctx.setTransform(dpr*view.z,0,0,dpr*view.z,dpr*view.x,dpr*view.y);
 ctx.lineCap='round';ctx.lineJoin='round';
 ctx.imageSmoothingQuality='medium';for(const s of strokes)if(s.img)drawImg(s);for(const s of strokes)if(!s.img)path(s);ctx.globalAlpha=1;
 ctx.globalAlpha=1;
 if(cur){if(incOn){path(cur);ctx.globalAlpha=1}else drawLive()}
 ovl();
 zl.textContent=Math.round(view.z*100)+'%';
}
function zoomAt(px,py,k){const nz=Math.min(100,Math.max(.01,view.z*k));k=nz/view.z;view.x=px-(px-view.x)*k;view.y=py-(py-view.y)*k;view.z=nz}
function bbox(L=strokes){let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;for(const s of L){const h=s.w/2;for(let i=0;i<s.p.length;i+=2){x0=Math.min(x0,s.p[i]-h);x1=Math.max(x1,s.p[i]+h);y0=Math.min(y0,s.p[i+1]-h);y1=Math.max(y1,s.p[i+1]+h)}}return{x0,y0,x1,y1}}
function fit(){if(!strokes.length){view={x:W/2,y:H/2,z:1};draw();return}
 const b=bbox(),bw=Math.max(b.x1-b.x0,40),bh=Math.max(b.y1-b.y0,40),z=Math.min(2,(W-190)/bw,(H-60)/bh);
 view={z,x:(W+104-bw*z)/2-b.x0*z+(bw-(b.x1-b.x0))*z/2,y:(H-bh*z)/2-b.y0*z+(bh-(b.y1-b.y0))*z/2};draw();save()}

function pushU(){undo.push(strokes.slice());if(undo.length>100)undo.shift();redo=[]}
function doUndo(){if(!undo.length)return;redo.push(strokes);strokes=undo.pop();sel=[];draw();save()}
function doRedo(){if(!redo.length)return;undo.push(strokes);strokes=redo.pop();sel=[];draw();save()}

function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function hit(s,x,y,r){const p=s.p;if(s.img)return pip(x,y,p);if(p.length<4)return Math.hypot(x-p[0],y-p[1])<r;for(let i=0;i<p.length-2;i+=2)if(segD(x,y,p[i],p[i+1],p[i+2],p[i+3])<r)return true;return false}
function erase(e){const[x,y]=tw(e.clientX,e.clientY),r=(8+size*1.5)/view.z;
 if(!lastE)lastE=[x,y];const d=Math.hypot(x-lastE[0],y-lastE[1]),n=Math.max(1,Math.ceil(d/(r*.7)));
 for(let i=1;i<=n;i++)eraseAt(lastE[0]+(x-lastE[0])*i/n,lastE[1]+(y-lastE[1])*i/n,r);lastE=[x,y]}

function shapePts(t,a,b,sh){let[x0,y0]=a,[x1,y1]=b,dx=x1-x0,dy=y1-y0;
 if(sh){if(t==='line'||t==='arrow'||t==='darrow'){const s=Math.PI/4,an=Math.round(Math.atan2(dy,dx)/s)*s,l=Math.hypot(dx,dy);dx=l*Math.cos(an);dy=l*Math.sin(an)}else{const m=Math.max(Math.abs(dx),Math.abs(dy));dx=Math.sign(dx||1)*m;dy=Math.sign(dy||1)*m}x1=x0+dx;y1=y0+dy}
 const mx=(x0+x1)/2,my=(y0+y1)/2;
 if(t==='line')return[x0,y0,x1,y1];
 if(t==='arrow'||t==='darrow'){const l=Math.hypot(dx,dy)||1,h=Math.min(Math.max(size*4,14),l*.5),an=Math.atan2(dy,dx),q=.45,f=(px,py,g)=>[px-h*Math.cos(g-q),py-h*Math.sin(g-q),px-h*Math.cos(g+q),py-h*Math.sin(g+q)];
  const E=f(x1,y1,an);if(t==='arrow')return[x0,y0,x1,y1,E[0],E[1],x1,y1,E[2],E[3]];
  const S=f(x0,y0,an+Math.PI);return[S[0],S[1],x0,y0,S[2],S[3],x0,y0,x1,y1,E[0],E[1],x1,y1,E[2],E[3]]}
 if(t==='rect')return[x0,y0,x1,y0,x1,y1,x0,y1,x0,y0];
 if(t==='tri')return[mx,y0,x1,y1,x0,y1,mx,y0];
 if(t==='dia')return[mx,y0,x1,my,mx,y1,x0,my,mx,y0];
 const p=[];for(let i=0;i<=72;i++){const g=i/72*2*Math.PI;p.push(mx+dx/2*Math.cos(g),my+dy/2*Math.sin(g))}return p}
function cut(s,x,y,R){const p=s.p,out=[],step=Math.max(R*.6,.5/view.z);let c=[];
 const add=(px,py)=>{if(Math.hypot(px-x,py-y)<R){if(c.length){out.push(c);c=[]}}else c.push(px,py)};
 if(p.length<4)add(p[0],p[1]);else for(let i=0;i<p.length-2;i+=2){const ax=p[i],ay=p[i+1],bx=p[i+2],by=p[i+3],n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/step));for(let j=i?1:0;j<=n;j++)add(ax+(bx-ax)*j/n,ay+(by-ay)*j/n)}
 if(c.length)out.push(c);
 return out.filter(a=>a.length>=4).map(a=>({...s,p:a}))}

function rgb(h){return[1,3,5].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ')}
function buildPdf(){
 const b=bbox(),m=40,w=Math.max(b.x1-b.x0,20)+2*m,h=Math.max(b.y1-b.y0,20)+2*m,k=Math.min(1,14400/Math.max(w,h));
 const X=x=>((x-b.x0+m)*k).toFixed(2),Y=y=>((h-(y-b.y0+m))*k).toFixed(2);
 let o='1 J 1 j\n';if(dark)o+='0.082 0.098 0.133 rg 0 0 '+(w*k).toFixed(2)+' '+(h*k).toFixed(2)+' re f\n';
 for(const s of strokes){const p=s.p;o+=(s.hl?'/G1 gs ':'/G0 gs ')+rgb(col(s.c))+' RG '+(s.w*k).toFixed(3)+' w\n'+X(p[0])+' '+Y(p[1])+' m\n';
  if(p.length<4)o+=X(p[0]+.01)+' '+Y(p[1])+' l\n';else for(let i=2;i<p.length;i+=2)o+=X(p[i])+' '+Y(p[i+1])+' l\n';o+='S\n'}
 const objs=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>',
  '<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+(w*k).toFixed(2)+' '+(h*k).toFixed(2)+']/Contents 4 0 R/Resources<</ExtGState<</G0<</CA 1>>/G1<</CA .35>>>>>>>>',
  '<</Length '+o.length+'>>\nstream\n'+o+'endstream'];
 let pdf='%PDF-1.4\n';const off=[];
 objs.forEach((t,i)=>{off.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+t+'\nendobj\n'});
 const xr=pdf.length;
 pdf+='xref\n0 5\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<</Size 5/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF';
 return new Blob([pdf],{type:'application/pdf'});
}
